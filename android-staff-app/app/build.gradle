plugins { id 'com.android.application' }

android {
    namespace 'com.garhwaltournadventure.booking'
    compileSdk 35

    defaultConfig {
        applicationId 'com.garhwaltournadventure.booking'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    dependencies {\n        implementation 'androidx.core:core:1.15.0'\n    }\n\n    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }
}
