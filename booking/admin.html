<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garhwal Tour N Adventure — Admin</title><style>
body{margin:0;font-family:system-ui;background:#eef2ed;color:#15322f}header{background:#15322f;color:#fff;padding:18px 22px;font-weight:900}header small{display:block;color:#f8c75a}main{max-width:1200px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid #d7dfd8;border-radius:14px;padding:18px;margin-bottom:16px}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd6cf;border-radius:8px}button,a{padding:10px 14px;border-radius:9px;border:0;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#e75b3b;color:#fff}.dark{background:#15322f;color:#fff}.ghost{background:#fff;color:#15322f;border:1px solid #d7dfd8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hidden{display:none}.table{overflow:auto;background:#fff;border:1px solid #d7dfd8;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:10px;border-bottom:1px solid #d7dfd8;text-align:left;font-size:13px}th{background:#f5f7f3}.muted{color:#6b8179}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
@media print{header,#login,#panel,.no-print{display:none!important}body{background:#fff}.invoice{display:block!important;border:0!important;box-shadow:none!important}}
.invoice{background:#fff;max-width:850px;margin:auto;padding:30px;border:1px solid #ddd}.invoiceHead{display:flex;justify-content:space-between;border-bottom:2px solid #15322f;padding-bottom:18px}.right{text-align:right}@media(max-width:700px){.invoiceHead{display:block}}
</style></head><body><header>GARHWAL TOUR N ADVENTURE<small>Admin / Travel Agent</small></header><main>
<div id="login" class="card"><h2>Admin Login</h2><p class="muted">Private management area.</p><input id="pw" type="password" placeholder="Admin password"><div class="actions"><button class="primary" id="loginBtn">Login</button><a class="ghost" href="/">Back to Booking</a></div><p id="msg" class="muted"></p></div>
<div id="panel" class="hidden"><div class="card"><h2>Booking Management</h2><input id="search" placeholder="Search booking / name / phone"></div><div class="table"><table><thead><tr><th>Booking</th><th>Guest</th><th>Service</th><th>Status</th><th>Vehicle / Driver</th><th>Payment</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="editor" class="card hidden"><h2>Manage Booking</h2><div class="grid"><div><label>Booking ID</label><input id="bid" readonly></div><div><label>Status</label><select id="status"><option>New</option><option>Confirmed</option><option>Cancelled</option><option>Completed</option></select></div><div><label>Vehicle number</label><input id="vehicle"></div><div><label>Driver name</label><input id="driver"></div><div><label>Driver phone</label><input id="driverPhone"></div><div><label>Customer price (GST included)</label><input id="price" type="number"></div><div><label>Advance</label><input id="advance" type="number"></div><div><label>Received now</label><input id="received" type="number"></div><div><label>Payment mode</label><select id="mode"><option>UPI</option><option>Cash</option></select></div><div><label>Paid to</label><select id="paidto"><option>Owner</option><option>Driver</option></select></div><div class="full"><label>Admin note</label><textarea id="note"></textarea></div></div><div class="actions"><button class="primary" id="save">Save Changes</button><button class="ghost" id="cancel">Cancel</button><button class="dark" id="print">Print Invoice</button></div></div></div>
<section id="invoice" class="hidden"><div class="actions no-print"><button class="dark" onclick="window.print()">Print / Save PDF</button><button class="ghost" onclick="showPanel()">Back to Admin</button></div><div id="invoiceBox" class="invoice"></div></section>
</main><script>
const $=x=>document.getElementById(x);let password='',data=[],current=null;
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-password':password,'Content-Type':'application/json'};const r=await fetch(url,opt);if(!r.ok)throw Error(await r.text());return r.json()}
$('loginBtn').onclick=async()=>{password=$('pw').value.trim();if(!password)return;try{data=(await api('/api/bookings')).bookings||[];$('login').classList.add('hidden');$('panel').classList.remove('hidden');render()}catch(e){password='';$('msg').textContent='Invalid password or admin service is not configured.'}};
function render(){let q=$('search').value.toLowerCase();let a=data.filter(r=>[r.booking_ref,r.name,r.phone,r.service].join(' ').toLowerCase().includes(q));$('rows').innerHTML=a.map(r=>'<tr><td><b>'+r.booking_ref+'</b><br>'+r.date+'</td><td>'+r.name+'<br>'+r.phone+'</td><td>'+r.service+'</td><td>'+r.status+'</td><td>'+(r.vehicle||'—')+'<br>'+(r.driver||'—')+'</td><td>'+money(r.paid)+' / '+money(r.price)+'</td><td><button class="ghost" onclick="edit(\''+r.id+'\')">Edit</button></td></tr>').join('')||'<tr><td colspan="7">No bookings found.</td></tr>'}
$('search').oninput=render;
window.edit=id=>{current=data.find(r=>r.id===id);if(!current)return;$('editor').classList.remove('hidden');$('bid').value=current.booking_ref;$('status').value=current.status;$('vehicle').value=current.vehicle||'';$('driver').value=current.driver||'';$('driverPhone').value=current.driver_phone||'';$('price').value=current.price||0;$('advance').value=current.advance||0;$('received').value=current.received||0;$('mode').value=current.mode||'UPI';$('paidto').value=current.paidto||'Owner';$('note').value=current.admin_note||''};
$('cancel').onclick=()=>$('editor').classList.add('hidden');
$('save').onclick=async()=>{if(!current)return;let p={status:$('status').value,vehicle:$('vehicle').value,driver:$('driver').value,driver_phone:$('driverPhone').value,price:+$('price').value||0,advance:+$('advance').value||0,received:+$('received').value||0,mode:$('mode').value,paidto:$('paidto').value,admin_note:$('note').value};p.paid=Math.min(p.price,p.advance+p.received);p.gst=p.price-p.price/1.05;try{current=(await api('/api/bookings?id='+encodeURIComponent(current.id),{method:'PATCH',body:JSON.stringify(p)})).booking;$('editor').classList.add('hidden');data=(await api('/api/bookings')).bookings||[];render();alert('Booking updated.')}catch(e){alert('Could not save changes.')}};
$('print').onclick=()=>{if(!current)return;renderInvoice(current);$('panel').classList.add('hidden');$('invoice').classList.remove('hidden');setTimeout(()=>window.print(),100)};
function showPanel(){$('invoice').classList.add('hidden');$('panel').classList.remove('hidden')}
function renderInvoice(r){let bal=(+r.price||0)-(+r.paid||0);$('invoiceBox').innerHTML='<div class="invoiceHead"><div><img src="/logo.svg" width="100" height="100"><h1>Garhwal Tour N Adventure</h1><b style="color:#e75b3b">Travel Beyond Borders</b><p class="muted">Uttarakhand, India · +91 80770 16559<br>Email: mangaljethuri7@gmail.com<br>MSME: UDYAM-UK-11-0006387</p></div><div class="right"><b>INVOICE</b><h3>'+r.booking_ref+'</h3>'+r.date+'</div></div><h3>Guest Details</h3><p>'+r.name+'<br>'+r.phone+(r.email?'<br>'+r.email:'')+(r.idtype?'<br>'+r.idtype+': '+r.idno:'')+'</p><h3>Service Details</h3><p>'+r.service+' · '+r.pax+' pax<br>'+((r.vehicle&&'Vehicle: '+r.vehicle+'<br>')||'')+((r.driver&&'Driver: '+r.driver+' '+(r.driver_phone||'')+'<br>')||'')+(r.details||'')+'</p><hr><p>Customer price (GST incl.): <b>'+money(r.price)+'</b><br>GST component: <b>'+money(r.gst)+'</b><br>Advance: <b>'+money(r.advance)+'</b><br>Received: <b>'+money(r.received)+'</b><br>Total paid: <b>'+money(r.paid)+'</b><br><b>Balance: '+money(bal)+'</b></p><p>Payment: '+(r.mode||'—')+' · Paid to '+(r.paidto||'—')+'</p><p style="margin-top:60px">Thank you for choosing Garhwal Tour N Adventure. <span style="float:right">Authorized Signature</span></p>'}
</script></body></html>
