<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garhwal Tour N Adventure — Admin</title>
<style>
:root{--green:#063b2b;--orange:#f36b08;--gold:#f8c75a;--bg:#eef3ef;--line:#d9e3dc;--muted:#61756d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:#102f27}header{background:var(--green);color:#fff;padding:18px 22px;font-weight:900}header small{display:block;color:var(--gold);font-style:italic}main{max-width:1200px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 5px 20px #063b2b0d}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd6cf;border-radius:8px;background:#fbfcfa;color:#15322f}textarea{min-height:80px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hidden{display:none}.table{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{background:#f5f8f5}.muted{color:var(--muted)}button,a{padding:10px 14px;border-radius:9px;border:0;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--orange);color:#fff}.dark{background:var(--green);color:#fff}.ghost{background:#fff;color:var(--green);border:1px solid var(--line)}
.invoice{background:#fff;max-width:900px;margin:auto;padding:30px;border:1px solid #dce5df;box-shadow:0 8px 30px #063b2b10}.invoice *{box-sizing:border-box}.invoiceTop{display:grid;grid-template-columns:125px 1fr 210px;gap:20px;align-items:center;border-bottom:2px solid var(--green);padding-bottom:20px}.logo{width:115px;height:115px}.company h1{font-size:28px;margin:0 0 4px;color:var(--green)}.tag{color:var(--orange);font-weight:900;font-size:15px}.contact{font-size:12px;color:var(--muted);line-height:1.65;margin-top:8px}.invoiceLabel{background:var(--green);color:#fff;border-radius:12px;padding:14px 16px;text-align:right}.invoiceLabel strong{display:block;font-size:23px;letter-spacing:.08em}.invoiceNo{font-size:14px;font-weight:900;margin-top:8px}.invoiceDate{font-size:12px;margin-top:3px;opacity:.9}.divider{display:flex;align-items:center;gap:12px;color:var(--green);font-size:11px;letter-spacing:.35em;font-weight:900;margin:18px 0}.divider:before,.divider:after{content:"";height:2px;background:var(--orange);flex:1}.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{border:1px solid var(--line);border-radius:12px;overflow:hidden}.panelTitle{padding:10px 14px;background:#e7f1eb;font-weight:900;font-size:15px;color:var(--green)}.panel:nth-child(2) .panelTitle{background:#fff0df}.panelBody{padding:13px 14px;font-size:13px;line-height:1.7;min-height:105px}.label{color:#60766e;font-size:11px}.value{font-weight:800;color:#172e28}.payment{margin-top:15px;border:1px solid var(--line);border-radius:12px;overflow:hidden}.paymentTitle{background:var(--green);color:#fff;padding:11px 14px;font-weight:900;display:flex;justify-content:space-between}.payment table{min-width:0;width:100%;box-shadow:none;border:0;border-radius:0}.payment th,.payment td{padding:10px 14px}.payment td:last-child,.payment th:last-child{text-align:right}.paidRow{background:#e7f4ea;font-weight:900}.balanceRow{background:#fff0df;color:var(--orange);font-size:16px;font-weight:900}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:15px}.smallbox{border:1px solid var(--line);border-radius:12px;padding:13px 14px;min-height:85px}.smallbox h4{margin:0 0 8px;color:var(--green);font-size:14px}.signature{text-align:right;margin-top:22px}.sigline{display:inline-block;width:190px;border-bottom:1px solid #555;margin-bottom:5px}.footer{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:end;color:var(--muted);font-size:11px}.footer b{color:var(--green);font-size:13px}
@media(max-width:760px){.grid,.panels,.bottom{grid-template-columns:1fr}.invoiceTop{grid-template-columns:85px 1fr}.logo{width:78px;height:78px}.invoiceLabel{grid-column:1/-1;text-align:left}.company h1{font-size:21px}.invoice{padding:18px}}
@page{size:A4 portrait;margin:0}
@media print{
html,body{width:210mm;height:297mm;background:#fff!important;margin:0!important;padding:0!important;overflow:hidden}
header,#login,#panel,.no-print{display:none!important}
main{margin:0!important;padding:0!important;max-width:none!important}
.invoice{display:block!important;width:210mm!important;height:297mm!important;max-width:none!important;margin:0!important;padding:8mm 9mm!important;border:0!important;box-shadow:none!important;overflow:hidden!important;font-size:10px!important}
.invoiceTop{grid-template-columns:82px 1fr 150px!important;gap:12px!important;padding-bottom:10px!important}
.logo{width:72px!important;height:72px!important}
.company h1{font-size:20px!important;margin-bottom:2px!important}
.tag{font-size:11px!important}
.contact{font-size:8.5px!important;line-height:1.45!important;margin-top:4px!important}
.invoiceLabel{padding:9px 11px!important;border-radius:8px!important}
.invoiceLabel strong{font-size:18px!important}
.invoiceNo{font-size:10px!important;margin-top:4px!important}
.invoiceDate{font-size:8.5px!important}
.divider{margin:9px 0!important;font-size:8px!important;gap:8px!important}
.panels{gap:9px!important}
.panel{border-radius:8px!important}
.panelTitle{padding:6px 9px!important;font-size:10px!important}
.panelBody{padding:7px 9px!important;font-size:9px!important;line-height:1.35!important;min-height:72px!important}
.label{font-size:8px!important}.value{font-size:9px!important}
.payment{margin-top:9px!important;border-radius:8px!important}
.paymentTitle{padding:7px 9px!important;font-size:9px!important}
.payment th,.payment td{padding:5px 9px!important;font-size:8.5px!important}
.balanceRow{font-size:10px!important}
.bottom{gap:9px!important;margin-top:9px!important}
.smallbox{padding:8px 9px!important;min-height:55px!important;font-size:8.5px!important}
.smallbox h4{margin-bottom:4px!important;font-size:9px!important}
.footer{margin-top:10px!important;padding-top:7px!important;font-size:8px!important}
.footer b{font-size:9px!important}
.signature{margin-top:10px!important}
.sigline{width:130px!important}
.invoiceTop,.panels,.payment,.bottom,.footer{break-inside:avoid!important;page-break-inside:avoid!important}
.paymentTitle{background:var(--green)!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paidRow{background:#e7f4ea!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.balanceRow{background:#fff0df!important;color:var(--orange)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head>
<body><header>GARHWAL TOUR N ADVENTURE<small>Admin / Travel Agent</small></header><main>
<div id="login" class="card"><h2>Admin Login</h2><p class="muted">Private management area.</p><input id="pw" type="password" autocomplete="current-password" placeholder="Admin password"><div class="actions"><button class="primary" id="loginBtn">Login</button><a class="ghost" href="/">Back to Booking</a></div><p id="msg" class="muted"></p></div>
<div id="panel" class="hidden"><div class="card"><h2>Booking Management</h2><input id="search" placeholder="Search booking / name / phone"></div><div class="table"><table><thead><tr><th>Booking</th><th>Guest</th><th>Service</th><th>Status</th><th>Vehicle / Driver</th><th>Payment</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="editor" class="card hidden"><h2>Manage Booking</h2><div class="grid"><div><label>Booking ID</label><input id="bid" readonly></div><div><label>Status</label><select id="status"><option>New</option><option>Confirmed</option><option>Cancelled</option><option>Completed</option></select></div><div><label>Vehicle number</label><input id="vehicle"></div><div><label>Driver name</label><input id="driver"></div><div><label>Driver phone</label><input id="driverPhone"></div><div><label>Customer price (GST included)</label><input id="price" type="number"></div><div><label>Advance</label><input id="advance" type="number"></div><div><label>Received now</label><input id="received" type="number"></div><div><label>Payment mode</label><select id="mode"><option>UPI</option><option>Cash</option></select></div><div><label>Paid to</label><select id="paidto"><option>Owner</option><option>Driver</option></select></div><div class="full"><label>Admin note</label><textarea id="note"></textarea></div></div><div class="actions"><button class="primary" id="save">Save Changes</button><button class="ghost" id="cancel">Cancel</button><button class="dark" id="print">Print Invoice</button><button class="primary" id="notify">Confirm &amp; Notify Guest</button></div><p id="notifyMsg" class="muted"></p></div></div>
<section id="invoice" class="hidden"><div class="actions no-print"><button class="dark" onclick="window.print()">Print / Save PDF</button><button class="ghost" onclick="showPanel()">Back to Admin</button></div><div id="invoiceBox" class="invoice"></div></section>
</main><script>
const $=x=>document.getElementById(x);let password='',data=[],current=null;
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const logoSvg="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 600\">\n<rect width=\"600\" height=\"600\" fill=\"#fff\"/>\n<circle cx=\"300\" cy=\"300\" r=\"278\" fill=\"none\" stroke=\"#063b2b\" stroke-width=\"18\"/>\n<circle cx=\"300\" cy=\"300\" r=\"255\" fill=\"none\" stroke=\"#f36b08\" stroke-width=\"8\"/>\n<circle cx=\"300\" cy=\"185\" r=\"75\" fill=\"#f36b08\"/>\n<g fill=\"#063b2b\"><path d=\"M55 315 L155 225 205 270 305 145 395 255 450 205 550 320 430 292 380 270 305 220 240 292 190 260 125 318z\"/><path fill=\"#fff\" d=\"M305 145 L280 185 305 172 323 204 344 177 380 270 305 220 240 292 270 245z\"/><path fill=\"#fff\" d=\"M155 225 L135 258 162 245 180 268 205 270z\"/><path fill=\"#fff\" d=\"M450 205 L425 242 450 232 472 258 490 270z\"/></g>\n<g fill=\"#063b2b\"><path d=\"M425 302 l12 -25 12 25 8 -18 10 18 8 -12 8 12 v30 h-58z\"/><path d=\"M465 310 l10 -23 10 23 7 -15 8 15 7 -10 7 10 v24 h-49z\"/><path d=\"M500 318 l9 -20 9 20 6 -12 7 12 6 -9 6 9 v20 h-43z\"/></g>\n<g fill=\"none\" stroke=\"#063b2b\" stroke-width=\"13\" stroke-linecap=\"round\"><path d=\"M275 285 C355 275 405 292 430 315\"/><path d=\"M250 315 C330 300 385 312 415 335\"/><path d=\"M225 345 C305 330 355 340 385 360\"/></g>\n<text x=\"300\" y=\"390\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"78\" font-weight=\"900\" fill=\"#063b2b\">GARHWAL</text>\n<text x=\"300\" y=\"425\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"25\" font-weight=\"700\" letter-spacing=\"4\" fill=\"#063b2b\">TOUR <tspan fill=\"#f36b08\">N</tspan> ADVENTURE</text>\n<path d=\"M190 447 H410\" stroke=\"#f36b08\" stroke-width=\"4\"/>\n<text x=\"300\" y=\"475\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"16\" letter-spacing=\"6\" fill=\"#063b2b\">TRAVEL BEYOND BORDERS</text>\n<text x=\"300\" y=\"558\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"15\" letter-spacing=\"5\" fill=\"#063b2b\">UTTARAKHAND</text></svg>";
const logoData='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(logoSvg);
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-password':password,'Content-Type':'application/json'};const r=await fetch(url,opt);if(!r.ok)throw Error(await r.text());return r.json()}
$('loginBtn').onclick=async()=>{password=$('pw').value.trim();if(!password)return;try{data=(await api('/api/bookings')).bookings||[];$('login').classList.add('hidden');$('panel').classList.remove('hidden');render()}catch(e){password='';$('msg').textContent='Invalid password or admin service is not configured.'}};
function render(){let q=$('search').value.toLowerCase();let a=data.filter(r=>[r.booking_ref,r.name,r.phone,r.service].join(' ').toLowerCase().includes(q));$('rows').innerHTML=a.map(r=>'<tr><td><b>'+r.booking_ref+'</b><br>'+r.date+'</td><td>'+r.name+'<br>'+r.phone+'</td><td>'+r.service+'</td><td>'+r.status+'</td><td>'+(r.vehicle||'—')+'<br>'+(r.driver||'—')+'</td><td>'+money(r.paid)+' / '+money(r.price)+'</td><td><button class="ghost" onclick="edit(\''+r.id+'\')">Edit</button></td></tr>').join('')||'<tr><td colspan="7">No bookings found.</td></tr>'}
$('search').oninput=render;
window.edit=id=>{current=data.find(r=>r.id===id);if(!current)return;$('editor').classList.remove('hidden');$('bid').value=current.booking_ref;$('status').value=current.status;$('vehicle').value=current.vehicle||'';$('driver').value=current.driver||'';$('driverPhone').value=current.driver_phone||'';$('price').value=current.price||0;$('advance').value=current.advance||0;$('received').value=current.received||0;$('mode').value=current.mode||'UPI';$('paidto').value=current.paidto||'Owner';$('note').value=current.admin_note||''};
$('cancel').onclick=()=>$('editor').classList.add('hidden');
async function saveCurrent(notifyEmail=false){if(!current)return;let p={status:$('status').value,vehicle:$('vehicle').value,driver:$('driver').value,driver_phone:$('driverPhone').value,price:+$('price').value||0,advance:+$('advance').value||0,received:+$('received').value||0,mode:$('mode').value,paidto:$('paidto').value,admin_note:$('note').value,notify_email:notifyEmail};p.paid=Math.min(p.price,p.advance+p.received);p.gst=p.price-p.price/1.05;const result=await api('/api/bookings?id='+encodeURIComponent(current.id),{method:'PATCH',body:JSON.stringify(p)});current=result.booking;$('editor').classList.add('hidden');data=(await api('/api/bookings')).bookings||[];render();return result.notification}
$('save').onclick=async()=>{try{await saveCurrent(false);alert('Booking updated.')}catch(e){alert('Could not save changes.')}};
$('notify').onclick=async()=>{try{const n=await saveCurrent(true);$('notifyMsg').textContent=n&&n.sent?'Confirmation email sent to guest.':(n&&n.reason==='email_not_configured_or_missing_guest_email'?'Email not sent: guest email or email service is not configured.':'Email notification could not be sent.');}catch(e){$('notifyMsg').textContent='Could not save/notify guest.'}};
$('print').onclick=()=>{if(!current)return;renderInvoice(current);$('panel').classList.add('hidden');$('invoice').classList.remove('hidden');setTimeout(()=>window.print(),250)};
function showPanel(){$('invoice').classList.add('hidden');$('panel').classList.remove('hidden')}
function renderInvoice(r){
const bal=(+r.price||0)-(+r.paid||0);
const customerEmail=r.email?'<div><span class="label">Email</span><br><span class="value">'+r.email+'</span></div>':'';
const id=r.idtype?'<div><span class="label">'+r.idtype+'</span><br><span class="value">'+(r.idno||'—')+'</span></div>':'';
const driver=r.driver?'<div><span class="label">Driver Name</span><br><span class="value">'+r.driver+'</span></div>':'';
const driverPhone=r.driver_phone?'<div><span class="label">Driver Phone</span><br><span class="value">'+r.driver_phone+'</span></div>':'';
const vehicle=r.vehicle?'<div><span class="label">Vehicle Number</span><br><span class="value">'+r.vehicle+'</span></div>':'';
const details=r.details?'<div style="margin-top:7px"><span class="label">Trip / Service Details</span><br><span class="value">'+r.details+'</span></div>':'';
$('invoiceBox').innerHTML='<div class="invoiceTop"><img class="logo" src="'+logoData+'" alt="Garhwal Tour N Adventure"><div class="company"><h1>Garhwal Tour N Adventure</h1><div class="tag">Travel Beyond Borders</div><div class="contact">📍 Uttarakhand, India &nbsp; · &nbsp; ☎ +91 80770 16559<br>✉ mangaljethuri7@gmail.com &nbsp; · &nbsp; MSME: UDYAM-UK-11-0006387</div></div><div class="invoiceLabel"><strong>INVOICE</strong><div class="invoiceNo">'+r.booking_ref+'</div><div class="invoiceDate">'+r.date+'</div></div></div><div class="divider">TRAVEL BEYOND BORDERS</div><div class="panels"><div class="panel"><div class="panelTitle">👤 Guest Details</div><div class="panelBody"><div><span class="label">Name</span><br><span class="value">'+r.name+'</span></div><div><span class="label">Phone</span><br><span class="value">'+r.phone+'</span></div>'+customerEmail+id+'</div></div><div class="panel"><div class="panelTitle">🚐 Service Details</div><div class="panelBody"><div><span class="label">Service</span><br><span class="value">'+r.service+' · '+r.pax+' pax</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:7px">'+vehicle+driver+driverPhone+'</div>'+details+'</div></div></div><div class="payment"><div class="paymentTitle"><span>Payment Summary (GST Included)</span><span>All amounts in INR (₹)</span></div><table><thead><tr><th>Description</th><th>Amount (₹)</th></tr></thead><tbody><tr><td>Customer price (GST incl.)</td><td><b>'+money(r.price)+'</b></td></tr><tr><td>GST component (5%)</td><td>'+money(r.gst)+'</td></tr><tr><td>Advance</td><td>'+money(r.advance)+'</td></tr><tr><td>Received now</td><td>'+money(r.received)+'</td></tr><tr class="paidRow"><td>Total Paid</td><td>'+money(r.paid)+'</td></tr><tr class="balanceRow"><td>Balance</td><td>'+money(bal)+'</td></tr></tbody></table></div><div class="bottom"><div class="smallbox"><h4>Payment Details</h4><div>Payment Mode&nbsp;&nbsp;: <b>'+(r.mode||'—')+'</b></div><div>Paid To&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: <b>'+(r.paidto||'—')+'</b></div></div><div class="smallbox"><h4>Notes</h4><div>'+(r.admin_note||'Thank you for choosing Garhwal Tour N Adventure.')+'</div></div></div><div class="footer"><div><b>Explore · Travel · Discover</b><br>UTTARAKHAND · INDIA</div><div class="signature"><div class="sigline"></div><br>Authorized Signature<br><b>Garhwal Tour N Adventure</b></div></div>';
}
</script></body></html>
