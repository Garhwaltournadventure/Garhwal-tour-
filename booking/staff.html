.bottomNav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -5px 18px #063b2b12;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));gap:5px}.navBtn{border:0;background:transparent;border-radius:14px;padding:7px 3px 6px;color:var(--muted);font-weight:800;font-size:11px;cursor:pointer}.navBtn span{display:block;font-size:20px;line-height:21px;margin-bottom:3px}.navBtn.active{background:#eaf4ef;color:var(--g)}.tabSection{display:none}.tabSection.active{display:block}#app{padding-bottom:82px}.teamGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.profilePhoto{width:88px;height:88px;border-radius:50%;object-fit:cover;border:3px solid #e7f1eb;background:#eaf4ef}.profileInitial{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:var(--g);color:#fff;font-size:30px;font-weight:900}.profileRow{display:flex;align-items:center;gap:14px;margin-bottom:15px}.profileActions{display:flex;gap:8px;flex-wrap:wrap}.modalBackdrop{position:fixed;inset:0;background:rgba(8,35,26,.42);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}.modalBox{width:min(360px,100%);background:#fff;border-radius:18px;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.22);text-align:center}.modalBox h3{margin:0 0 8px;color:var(--g);font-size:18px}.modalBox p{margin:0 0 16px;color:var(--muted);font-size:14px;white-space:pre-line}.modalBox input{margin-bottom:12px;text-align:left}.modalBtns{display:flex;gap:8px;justify-content:center}.modalBtns .btn{flex:1}.photoButton{display:inline-flex;align-items:center;gap:6px;margin-top:7px}.teamAction{display:flex;align-items:center;gap:10px;width:100%;padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--g);cursor:pointer;text-align:left}.teamAction span{font-size:23px}.teamAction small{display:block;color:var(--muted);font-size:11px;margin-top:3px}@media(max-width:650px){.teamGrid{grid-template-columns:1fr}}</style></head><body><header id="authHeader" class="hidden"><div class="head"><div class="brand">GARHWAL TOUR N ADVENTURE<small>Team GTA</small></div></div></header><main class="wrap">
<section id="loginPage" class="loginPage"><div class="loginWrap"><img class="companyLogo" src="/logo.svg" alt="Garhwal Tour N Adventure"><section id="login" class="card loginCard"><div class="loginBrand">GARHWAL TOUR N ADVENTURE<small>Staff Portal</small></div><h2>Welcome back 👋</h2><p class="muted">Sign in with your email or phone number.</p><div class="loginTabs"><button id="loginTab" class="tabBtn active" type="button">Login</button><button id="registerTab" class="tabBtn" type="button">Register</button><button id="forgotTab" class="tabBtn" type="button">Forgot Password</button></div><div id="loginForm"><label>Email or phone</label><input id="username" inputmode="email" autocomplete="username" placeholder="Email or phone number"><label style="display:block;margin-top:10px">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"><div class="actions" style="margin-top:14px"><button id="loginBtn" class="btn primary" type="button">Login</button></div></div><div id="registerForm" class="hidden"><div class="grid"><div><label>Full name</label><input id="regName" placeholder="Your name"></div><div><label>Phone</label><input id="regPhone" inputmode="tel" placeholder="Phone number"></div></div><label style="display:block;margin-top:10px">Email</label><input id="regEmail" type="email" placeholder="Email address"><label style="display:block;margin-top:10px">Password</label><input id="regPassword" type="password" placeholder="Create password"><label style="display:block;margin-top:10px">Designation</label><select id="regDesignation"><option>Driver</option><option>Tour Manager</option><option>Tour Guide</option><option>Booking Executive</option><option>Operations Staff</option><option>Accountant</option></select><button id="registerBtn" class="btn primary" style="width:100%;margin-top:14px" type="button">Send Registration Request</button><p class="muted">Your account will stay pending until Admin approves it.</p></div><div id="forgotForm" class="hidden"><p class="muted">Enter your registered email or phone. Admin will review the reset request.</p><label>Email or phone</label><input id="forgotIdentifier" placeholder="Email or phone number"><button id="forgotBtn" class="btn primary" style="width:100%;margin-top:14px" type="button">Send Reset Request</button></div><p id="msg" class="muted"></p></section></div></section>

</main><div id="uiModal" class="modalBackdrop hidden"><div class="modalBox"><h3 id="uiModalTitle">Message</h3><p id="uiModalText"></p><input id="uiModalInput" class="hidden" type="text"><div class="modalBtns"><button id="uiModalCancel" class="btn ghost hidden" type="button">Cancel</button><button id="uiModalOk" class="btn primary" type="button">OK</button></div></div></div><script>
const $=id=>document.getElementById(id);let token='',user=null,bookings=[];let firstLoad=true;
function notifyNewBookings(list){
 if(!user||user.role!=='admin'||!list.length)return;
 const key='gta_last_booking_created_at';
 const latest=list[0]?.created_at||'';
 const previous=localStorage.getItem(key);
 if(!previous){if(latest)localStorage.setItem(key,latest);return;}
 const fresh=list.filter(x=>x.created_at&&x.created_at>previous);
 if(fresh.length){
   const b=fresh[0];
   const title='New Booking — '+b.booking_ref;
   const body=(b.name||'Guest')+' · '+(b.service||'Service')+' · '+(b.date||'Date')+' · '+(b.pax||1)+' pax';
   try{
     if(window.AndroidNotifications?.notifyBooking) window.AndroidNotifications.notifyBooking(title,body);
   }catch(e){}
   if('Notification' in window && Notification.permission==='granted'){
     try{new Notification(title,{body,tag:b.booking_ref})}catch(e){}
   }
   if('Notification' in window && Notification.permission==='default'){
     try{Notification.requestPermission()}catch(e){}
   }
 }
 if(latest)localStorage.setItem(key,latest);
}
async function pollNewBookings(){
 if(!token||!user||user.role!=='admin')return;
 try{
   const x=await api('bookings');
   const list=x.bookings||[];
   notifyNewBookings(list);
   bookings=list;
   if(window.gtaActiveTab==='team'||window.gtaActiveTab==='settings')return;
   // Preserve unsaved worker-creation fields while the 15s booking poll runs.
   const draft={};
   ['wu','wn','wp','wd','pa','pv','pg','pp'].forEach(id=>{
     const el=$(id);
     if(el) draft[id]=el.type==='checkbox'?el.checked:el.value;
   });
   render();
   Object.keys(draft).forEach(id=>{
     const el=$(id);
     if(!el)return;
     if(el.type==='checkbox')el.checked=draft[id]; else el.value=draft[id];
   });
 }catch(e){}
}

const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
async function api(action,opt={}){opt.headers={...(opt.headers||{}),'x-staff-token':token,'Content-Type':'application/json'};const r=await fetch('/api/staff?action='+action,opt);if(!r.ok)throw Error(await r.text());return r.json()}
function showLoginTab(tab){$('loginForm').classList.toggle('hidden',tab!=='login');$('registerForm').classList.toggle('hidden',tab!=='register');$('forgotForm').classList.toggle('hidden',tab!=='forgot');$('loginTab').classList.toggle('active',tab==='login');$('registerTab').classList.toggle('active',tab==='register');$('forgotTab').classList.toggle('active',tab==='forgot');$('msg').textContent='';}
$('loginBtn').onclick=async()=>{const btn=$('loginBtn');btn.disabled=true;try{const identifier=$('username').value.trim(),pw=$('password').value;if(!identifier||!pw)throw Error('Enter your email/phone and password.');let r;if(identifier.toLowerCase()==='admin'){r=await fetch('/api/staff?action=admin-login',{method:'POST',headers:{'x-admin-password':pw}})}else{r=await fetch('/api/staff?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier,password:pw})})}const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Login failed.');token=x.token;user=x.user;sessionStorage.setItem('gta_staff_token',token);sessionStorage.setItem('gta_staff_user',JSON.stringify(user));showApp();}catch(e){$('msg').textContent=e.message||'Login failed.'}finally{btn.disabled=false}};
$('loginTab').onclick=()=>showLoginTab('login');$('registerTab').onclick=()=>showLoginTab('register');$('forgotTab').onclick=()=>showLoginTab('forgot');
async function registerNativePush(){
 for(let i=0;i<60;i++){
  try{
   const t=window.AndroidNotifications?.getPushToken?.();
   if(t){
    await api('register-token',{method:'POST',body:JSON.stringify({token:String(t)})});
    return true;
   }
  }catch(e){}
  await new Promise(r=>setTimeout(r,1000));
 }
 return false;
}
async function showApp(){
 $('loginPage').classList.add('hidden');
 $('authHeader').classList.remove('hidden');
 $('app').classList.remove('hidden');
 render();
 await load();
 if(user){registerNativePush();if(user.role==='admin'&&!window.gtaBookingPollStarted){window.gtaBookingPollStarted=true;setInterval(()=>{registerNativePush();pollNewBookings()},15000);}}
}
function forceLogout(message=''){
 token='';user=null;bookings=[];window.gtaActiveTab='home';sessionStorage.removeItem('gta_staff_token');sessionStorage.removeItem('gta_staff_user');
 $('app').classList.add('hidden');$('authHeader').classList.add('hidden');$('loginPage').classList.remove('hidden');
 if(message)$('msg').textContent=message;
 showLoginTab('login');
}

async function uiAlert(message,title='Message'){return new Promise(resolve=>{const m=$('uiModal'),t=$('uiModalTitle'),p=$('uiModalText'),ok=$('uiModalOk'),cancel=$('uiModalCancel'),inp=$('uiModalInput');t.textContent=title;p.textContent=String(message||'');inp.classList.add('hidden');cancel.classList.add('hidden');ok.textContent='OK';m.classList.remove('hidden');ok.onclick=()=>{m.classList.add('hidden');resolve(true)}})}
function uiConfirm(message,title='Confirm'){return new Promise(resolve=>{const m=$('uiModal'),t=$('uiModalTitle'),p=$('uiModalText'),ok=$('uiModalOk'),cancel=$('uiModalCancel'),inp=$('uiModalInput');t.textContent=title;p.textContent=String(message||'');inp.classList.add('hidden');cancel.classList.remove('hidden');ok.textContent='OK';cancel.textContent='Cancel';m.classList.remove('hidden');ok.onclick=()=>{m.classList.add('hidden');resolve(true)};cancel.onclick=()=>{m.classList.add('hidden');resolve(false)}})}
function uiPrompt(message,value='',title='Edit'){return new Promise(resolve=>{const m=$('uiModal'),t=$('uiModalTitle'),p=$('uiModalText'),ok=$('uiModalOk'),cancel=$('uiModalCancel'),inp=$('uiModalInput');t.textContent=title;p.textContent=String(message||'');inp.classList.remove('hidden');inp.value=value||'';cancel.classList.remove('hidden');ok.textContent='Save';cancel.textContent='Cancel';m.classList.remove('hidden');setTimeout(()=>{inp.focus();inp.select()},50);ok.onclick=()=>{const v=inp.value;m.classList.add('hidden');resolve(v)};cancel.onclick=()=>{m.classList.add('hidden');resolve(null)}})}
async function saveProfile(data){
 try{
  const r=await api('profile',{method:'POST',body:JSON.stringify(data)});
  if(r.user){user=r.user;sessionStorage.setItem('gta_staff_user',JSON.stringify(user));render();}
  return r;
 }catch(e){throw e}
}
async function resizePhoto(file){
 if(!file||!file.type.startsWith('image/'))throw Error('Please choose an image file.');
 if(file.size>8*1024*1024)throw Error('Photo is too large. Choose an image under 8 MB.');
 const src=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Could not read photo.'));r.readAsDataURL(file)});
 const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(Error('Could not open photo.'));i.src=src});
 const max=512,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
 const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);
 return canvas.toDataURL('image/jpeg',0.78);
}
async function changePassword(){
 const current=$('currentPassword').value,next=$('newPassword').value,confirmPw=$('confirmPassword').value;
 if(!current||!next||!confirmPw)return uiAlert('Fill all password fields.');
 if(next.length<6)return uiAlert('New password must be at least 6 characters.');
 if(next!==confirmPw)return uiAlert('New password and confirmation do not match.');
 try{
  await saveProfile({currentPassword:current,newPassword:next});
  $('currentPassword').value='';$('newPassword').value='';$('confirmPassword').value='';
  uiAlert('Password changed successfully.');
 }catch(e){uiAlert(e.message||'Could not change password.');}
}
async function chooseProfilePhoto(file){
 try{
  const avatar_data=await resizePhoto(file);
  await saveProfile({avatar_data});
  uiAlert('Profile photo updated.');
 }catch(e){uiAlert(e.message||'Could not update photo.');}
}
async function load(){
 let me;
 try{
  me=await api('me');
 }catch(e){forceLogout('Session expired. Please login again.');return;}
 user=me.user;
 sessionStorage.setItem('gta_staff_user',JSON.stringify(user));
 try{bookings=(await api('bookings')).bookings||[];}catch(e){bookings=[];}
 render();
 if(user.role==='admin')loadUsers();
}
async function loadUsers(){try{const r=await api('users');const list=(r.users||[]).filter(u=>u.username!=='admin');const count=$('workerCount');if(count)count.textContent=list.length+' Worker'+(list.length===1?'':'s');$('usersList').innerHTML=list.map(u=>{let p={};try{p=JSON.parse(u.permissions||'{}')}catch(e){}const n=String(u.display_name||'Worker').replace(/'/g,'\\&#39;');const d=String(u.designation||'Staff').replace(/'/g,'\\&#39;');const un=String(u.username||'').replace(/'/g,'\\&#39;');return '<div class="job" style="margin-top:9px;padding:13px"><div class="jobhead"><div><b>'+n+'</b><div class="muted">'+d+' · @'+un+'</div></div><span class="pill '+(u.active?'':'danger')+'">'+(u.active?'Active':'Disabled')+'</span></div><div class="muted" style="margin:6px 0 9px">'+(p.view_all?'All bookings':'Assigned bookings')+' · '+(p.guest_contact?'Guest contact':'No guest contact')+' · '+(p.payment_details?'Payment details':'No payment details')+'</div><div class="actions"><button class="btn ghost" style="padding:7px 10px" onclick="editUser(\''+u.id+'\',\''+n+'\',\''+d+'\','+(!!p.view_assigned)+','+(!!p.view_all)+','+(!!p.guest_contact)+','+(!!p.payment_details)+')">✏️ Edit</button><button class="btn danger" style="padding:7px 10px" onclick="deleteUser(\''+u.id+'\',\''+n+'\')">🗑 Delete</button></div></div>'}).join('')||'<p class="muted">No workers added yet.</p>'}catch(e){$('usersList').textContent='Could not load workers.'}}
async function editUser(id,name,designation,assigned,all,contact,payment){const d=await uiPrompt('Designation:',designation,'Edit Worker');if(d===null)return;const a=await uiConfirm('Allow assigned bookings?','Assigned bookings');const v=await uiConfirm('Allow all bookings?','All bookings');const g=await uiConfirm('Allow guest contact and WhatsApp?','Guest contact');const p=await uiConfirm('Allow payment details?','Payment details');if(!a&&!v)return uiAlert('Worker must have at least one booking access permission.');try{await api('users',{method:'PATCH',body:JSON.stringify({id,designation:d.trim()||'Staff',permissions:{view_assigned:a,view_all:v,guest_contact:g,payment_details:p}})});await loadUsers();uiAlert('Worker permissions updated.')}catch(e){uiAlert(e.message||'Could not update worker.')}}
async function deleteUser(id,name){if(!(await uiConfirm('Delete worker '+name+'? This cannot be undone.')))return;try{await api('users',{method:'DELETE',body:JSON.stringify({id})});await loadUsers();uiAlert('Worker deleted.')}catch(e){uiAlert(e.message||'Could not delete worker.')}}
async function loadRegistrationRequests(){try{const r=await api('registration-requests');const el=$('registrationList');if(!el)return;el.innerHTML=(r.requests||[]).filter(x=>x.status==='Pending').map(x=>'<div class="requestCard"><div><b>'+x.name+'</b><div class="muted">'+(x.designation||'Staff')+' · '+(x.email||x.phone||'No contact')+'</div></div><div class="actions"><button class="btn primary" onclick="registrationAction(\''+x.id+'\',\'approve\')">Approve</button><button class="btn ghost" onclick="registrationAction(\''+x.id+'\',\'deny\')">Deny</button></div></div>').join('')||'<p class="muted">No pending registration requests.</p>'}catch(e){const el=$('registrationList');if(el)el.textContent='Could not load registration requests.'}}
async function registrationAction(id,action){if(!(await uiConfirm(action==='approve'?'Approve this employee registration?':'Deny this employee registration?')))return;try{await api('registration-action',{method:'POST',body:JSON.stringify({id,action})});await loadRegistrationRequests();uiAlert(action==='approve'?'Employee approved. They can now log in.':'Registration denied.')}catch(e){uiAlert(e.message||'Could not process request.')}}
function openAdminTool(name){document.getElementById('workersTool').classList.add('hidden');document.getElementById('requestsTool').classList.add('hidden');if(name==='requests'){document.getElementById('requestsTool').classList.remove('hidden');loadRegistrationRequests();document.getElementById('requestsTool').scrollIntoView({behavior:'smooth'});}if(name==='workers'){document.getElementById('workersTool').classList.remove('hidden');loadUsers();document.getElementById('workersTool').scrollIntoView({behavior:'smooth'});}}
function closeAdminTool(){document.getElementById('workersTool').classList.add('hidden');}
function showCreateWorker(){document.getElementById('createWorkerBox').classList.toggle('hidden');}
async function createWorker(){const username=$('wu').value.trim(),display_name=$('wn').value.trim(),email=$('we').value.trim(),phone=$('wh').value.trim(),password=$('wp').value,designation=$('wd').value;const permissions={view_assigned:$('pa').checked,view_all:$('pv').checked,guest_contact:$('pg').checked,payment_details:$('pp').checked};if(!username||!display_name||(!email&&!phone)||password.length<4)return uiAlert('Enter username, worker name, email or phone, and a 4+ character password.');if(!permissions.view_assigned&&!permissions.view_all)return uiAlert('Give the worker at least one booking access permission.');try{await api('users',{method:'POST',body:JSON.stringify({username,display_name,email,phone,password,designation,permissions})});$('wu').value='';$('wn').value='';$('we').value='';$('wh').value='';$('wp').value='';await loadUsers();uiAlert('Worker account created.')}catch(e){uiAlert(e.message||'Could not create worker.')}}
async function toggleUser(id,active){try{await api('users',{method:'PATCH',body:JSON.stringify({id,active})});await loadUsers()}catch(e){uiAlert('Could not update worker.')}}
window.gtaActiveTab=window.gtaActiveTab||'home';
function switchTab(tab){
 window.gtaActiveTab=tab;
 document.querySelectorAll('.tabSection').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));
 document.querySelectorAll('.navBtn').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));
 if(tab==='team'&&user&&user.role==='admin'){loadUsers();loadRegistrationRequests();}
}
function render(){
 if(!user)return;
 const mine=user.role==='worker';
 const total=bookings.length;
 const pending=bookings.filter(x=>x.status==='New').length;
 const confirmed=bookings.filter(x=>x.status==='Confirmed').length;
 const completed=bookings.filter(x=>x.status==='Completed').length;
 const cancelled=bookings.filter(x=>x.status==='Cancelled').length;
 const today=new Date().toISOString().slice(0,10);
 const todayCount=bookings.filter(x=>x.date===today).length;
 const active=window.gtaActiveTab||'home';

 let h='';
 h+='<section class="tabSection '+(active==='home'?'active':'')+'" data-tab="home">';
 h+='<div class="card heroCard"><div><div class="muted">'+(mine?'Team GTA · My Workspace':'Team GTA · Booking Engine')+'</div><h2 style="margin:4px 0 3px">'+(user.display_name||'User')+'</h2>'+(mine?'<span class="pill">'+(user.designation||'Staff')+'</span>':'<span class="pill">Administrator</span>')+'</div><div style="text-align:right"><div class="muted">Today</div><div class="stat">'+todayCount+'</div></div></div>';
 h+='<div class="quickStats"><div><b>'+total+'</b><span>Total Bookings</span></div><div><b>'+pending+'</b><span>Pending / New</span></div><div><b>'+confirmed+'</b><span>Confirmed</span></div><div><b>'+completed+'</b><span>Completed</span></div><div><b>'+cancelled+'</b><span>Cancelled</span></div><div><b>'+todayCount+'</b><span>Today</span></div></div>';
 h+='<div class="card"><h3 style="margin-top:0">'+(mine?'My Work':'Booking Engine')+'</h3><p class="muted">'+(mine?'Your assigned bookings, guest details and permissions are available in the tabs below.':'Use the bottom tabs to keep bookings, team and settings separate.')+'</p><button class="btn primary" type="button" onclick="switchTab(\'bookings\')">Open Bookings</button></div>';
 h+='</section>';

 h+='<section class="tabSection '+(active==='bookings'?'active':'')+'" data-tab="bookings">';
 h+='<div class="sectionTitle"><h3>'+(mine?'My Bookings':'Bookings')+'</h3><span class="muted">'+total+' total</span></div>';
 let j=bookings.map(r=>{
  const canContact=!mine||user.permissions?.guest_contact;
  const canPay=!mine||user.permissions?.payment_details;
  return '<div class="job"><div class="jobhead"><div><b>'+r.booking_ref+'</b><div class="muted">'+(r.date||'Date not set')+' · '+r.service+' · '+r.pax+' pax</div></div><span class="pill '+(r.status==='Cancelled'?'danger':r.status==='New'?'orange':'')+'">'+(r.status==='New'?'Pending':r.status)+'</span></div><div class="jobGuest"><div class="avatar">'+String(r.name||'G').trim().charAt(0).toUpperCase()+'</div><div><b>'+r.name+'</b><div class="muted">'+(canContact?r.phone:'Contact hidden by permission')+'</div></div></div><div class="jobGrid"><div><span>Service</span><b>'+r.service+'</b></div><div><span>Pax</span><b>'+r.pax+'</b></div><div><span>Vehicle</span><b>'+(r.vehicle||'Not assigned')+'</b></div><div><span>Driver</span><b>'+(r.driver||'Not assigned')+'</b></div></div><details><summary>View booking details</summary><table><tr><td><b>Tour / Service</b></td><td>'+(r.details||'—')+'</td></tr><tr><td><b>Additional Note</b></td><td>'+(r.payment_note||'—')+'</td></tr>'+(canPay?'<tr><td><b>Payment</b></td><td>'+money(r.paid)+' / '+money(r.price)+'</td></tr>':'')+'</table></details>'+(canContact?'<div class="actions" style="margin-top:12px"><a class="btn primary" href="tel:'+r.phone+'">📞 Call Guest</a><a class="btn ghost" href="https://wa.me/'+String(r.phone).replace(/\D/g,'')+'" target="_blank">💬 WhatsApp</a></div>':'<div class="muted" style="margin-top:12px">Guest contact is hidden by your permission.</div>')+'</div>';
 }).join('');
 h+=(j||'<div class="card"><p class="muted">No bookings yet.</p></div>');
 h+='</section>';

 h+='<section class="tabSection '+(active==='team'?'active':'')+'" data-tab="team">';
 if(!mine){
  h+='<div class="card"><div class="sectionTitle"><div><h3 style="margin:0">Team GTA</h3><p class="muted" style="margin:5px 0 0">All workers and their roles.</p></div><span class="pill" id="workerCount">0 Workers</span></div><div class="teamGrid" style="margin-top:12px"><button class="teamAction" type="button" onclick="showCreateWorker()"><span>👤＋</span><div><b>Add Worker</b><small>Create a worker account</small></div></button><button class="teamAction" type="button" onclick="$(\'requestsTool\').classList.toggle(\'hidden\');loadRegistrationRequests()"><span>📋</span><div><b>Registration Requests</b><small>Approve or deny requests</small></div></button></div><div id="usersList" class="workerList" style="margin-top:14px">Loading workers…</div></div>';
  h+='<div id="createWorkerBox" class="card hidden"><div class="toolHead"><div><h3 style="margin:0">Create Worker</h3><div class="muted">Enter the account details and permissions.</div></div><button class="btn ghost" type="button" onclick="showCreateWorker()">Close</button></div><div class="grid" style="margin-top:12px"><div><label>Username</label><input id="wu" autocomplete="off" placeholder="worker username"></div><div><label>Worker name</label><input id="wn" placeholder="Full name"></div><div><label>Email</label><input id="we" type="email" placeholder="Email"></div><div><label>Phone</label><input id="wh" inputmode="tel" placeholder="Phone"></div><div><label>Password</label><input id="wp" type="password" placeholder="Minimum 4 characters"></div><div><label>Designation</label><select id="wd"><option>Driver</option><option>Tour Manager</option><option>Tour Guide</option><option>Booking Executive</option><option>Operations Staff</option><option>Accountant</option></select></div></div><div style="margin-top:12px"><b>Permissions</b><div class="grid" style="margin-top:7px"><label><input id="pa" type="checkbox" checked style="width:auto"> Assigned bookings</label><label><input id="pv" type="checkbox" style="width:auto"> All bookings</label><label><input id="pg" type="checkbox" checked style="width:auto"> Guest contact</label><label><input id="pp" type="checkbox" style="width:auto"> Payment details</label></div></div><button class="btn primary bottomAction" type="button" onclick="createWorker()">Create Worker Account</button></div>';
  h+='<div id="requestsTool" class="card hidden"><div class="toolHead"><div><h3 style="margin:0">Registration Requests</h3><div class="muted">Pending worker registrations.</div></div><button class="btn ghost" type="button" onclick="$(\'requestsTool\').classList.add(\'hidden\')">Close</button></div><div id="registrationList" class="workerList">Loading requests…</div></div>';
 }else{
  h+='<div class="card"><h3 style="margin-top:0">My Access</h3><p class="muted">Designation: <b>'+((user.designation||'Staff'))+'</b></p><div class="jobGrid"><div><span>Bookings</span><b>'+(user.permissions?.view_all?'All bookings':'Assigned only')+'</b></div><div><span>Guest contact</span><b>'+(user.permissions?.guest_contact?'Allowed':'Hidden')+'</b></div><div><span>Payments</span><b>'+(user.permissions?.payment_details?'Allowed':'Hidden')+'</b></div></div></div>';
 }
 h+='</section>';

 h+='<section class="tabSection '+(active==='settings'?'active':'')+'" data-tab="settings">';
h+='<div class="card"><h3 style="margin-top:0">Settings</h3><p class="muted">Manage your profile and account.</p>';
h+='<div class="profileRow">'+(user.avatar_data?'<img class="profilePhoto" src="'+user.avatar_data+'" alt="Profile photo">':'<div class="profileInitial">'+String(user.display_name||'U').trim().charAt(0).toUpperCase()+'</div>')+'<div><b>'+((user.display_name||'User'))+'</b><div class="muted">'+(mine?(user.designation||'Staff'):'Administrator')+'</div><div class="profileActions"><button class="btn ghost photoButton" type="button" onclick="$('photoInput').click()">📷 Change Photo</button><input id="photoInput" type="file" accept="image/*" class="hidden" onchange="chooseProfilePhoto(this.files[0])"></div></div></div>';
h+='<table><tr><td>Name</td><td><b>'+((user.display_name||'—'))+'</b></td></tr><tr><td>Role</td><td><b>'+(mine?'Worker':'Administrator')+'</b></td></tr><tr><td>Designation</td><td><b>'+((user.designation||'Administrator'))+'</b></td></tr>'+(user.email?'<tr><td>Email</td><td><b>'+user.email+'</b></td></tr>':'')+(user.phone?'<tr><td>Phone</td><td><b>'+user.phone+'</b></td></tr>':'')+'</table></div>';
h+='<div class="card"><h3 style="margin-top:0">Change Password</h3><p class="muted">Use your current password to set a new one.</p><label>Current password</label><input id="currentPassword" type="password" autocomplete="current-password" placeholder="Current password"><label style="display:block;margin-top:10px">New password</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="Minimum 6 characters"><label style="display:block;margin-top:10px">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter new password"><button class="btn primary" style="margin-top:14px;width:100%" type="button" onclick="changePassword()">Change Password</button></div>';
h+='<div class="card"><button class="btn ghost" style="width:100%" onclick="forceLogout()">Logout</button></div></section>';

 $('dashboard').innerHTML=h;
 $('jobs').innerHTML='';
 const nav=mine?[['home','⌂','Home'],['bookings','▣','Bookings'],['team','👥','Access'],['settings','⚙','Settings']]:[['home','⌂','Dashboard'],['bookings','▣','Bookings'],['team','👥','Team'],['settings','⚙','Settings']];
 $('dashboard').insertAdjacentHTML('beforeend','<nav class="bottomNav">'+nav.map(x=>'<button class="navBtn '+(active===x[0]?'active':'')+'" data-tab="'+x[0]+'" type="button" onclick="switchTab(\''+x[0]+'\')"><span>'+x[1]+'</span>'+x[2]+'</button>').join('')+'</nav>');
}
(async function(){
 const t=sessionStorage.getItem('gta_staff_token');
 if(!t)return;
 token=t;
 try{
  const me=await api('me');
  user=me.user;
  sessionStorage.setItem('gta_staff_user',JSON.stringify(user));
  await showApp();
 }catch(e){forceLogout();}
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/booking/staff-sw.js').catch(()=>{});
</script></body></html>
