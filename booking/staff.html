<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b2b"><link rel="manifest" href="/staff-manifest.json"><title>Garhwal Staff App</title>
<style>
:root{--g:#063b2b;--g2:#0b513d;--o:#f36b08;--gold:#f8c75a;--bg:#f4f7f5;--line:#e1e8e4;--muted:#6b7c75;--text:#17372d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text)}header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:15px 16px;position:sticky;top:0;z-index:5;box-shadow:0 3px 14px #063b2b22}.head{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:14px;letter-spacing:.2px}.brand small{display:block;color:var(--gold);font-style:italic;font-size:11px;margin-top:2px}.wrap{max-width:900px;margin:14px auto;padding:0 12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 5px 20px #063b2b0b}input,select{width:100%;padding:12px;border:1px solid #d2ddd7;border-radius:12px;background:#fbfcfa;font-size:14px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:var(--o);color:#fff}.dark{background:var(--g);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--g)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px}.hidden{display:none}.job{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:10px;box-shadow:0 3px 12px #063b2b08}.jobhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.jobhead b{font-size:15px}.pill{padding:5px 9px;border-radius:999px;background:#e7f1eb;font-size:11px;font-weight:800;white-space:nowrap}.orange{background:#fff0df;color:#b84c00}.danger{background:#fce5e0;color:#9b2c1c}.stat{font-size:30px;font-weight:900;color:var(--g)}table{width:100%;border-collapse:separate;border-spacing:0 3px}td{padding:7px 5px;font-size:13px;vertical-align:top}td:first-child{width:34%;color:var(--muted)}a{color:var(--o);font-weight:800;text-decoration:none}.heroCard{display:flex;justify-content:space-between;align-items:center}.quickStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:-3px 0 14px}.quickStats>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center}.quickStats b{display:block;font-size:20px;color:var(--g)}.quickStats span{font-size:11px;color:var(--muted)}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:8px 2px}.sectionTitle h3{margin:0 0 8px}.adminMenu{display:grid;gap:9px}.menuBtn{display:flex;align-items:center;gap:12px;width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--g);text-decoration:none;text-align:left}.menuBtn>span{font-size:22px}.menuBtn div{flex:1}.menuBtn small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.menuBtn strong{font-size:22px;color:var(--muted)}.toolHead{display:flex;justify-content:space-between;align-items:center}.bottomAction{width:100%;margin-top:14px}.workerList{margin-top:16px}.workerList>div{background:#f8faf9;border-radius:13px;padding:12px;margin-bottom:8px}.adminHub{padding-bottom:12px}.requestCard{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f8faf9;border-radius:13px;padding:12px;margin-bottom:8px}.jobGuest{display:flex;align-items:center;gap:10px;margin:12px 0;padding:10px;border-radius:12px;background:#f7faf8}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--g);color:#fff;font-weight:900}.jobGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.jobGrid>div{padding:9px;border:1px solid var(--line);border-radius:11px}.jobGrid span{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.jobGrid b{font-size:13px}details{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}summary{cursor:pointer;font-weight:800;color:var(--g);font-size:13px}.job .actions{margin-top:12px}.job .actions .btn{flex:1;text-align:center}.job .actions .primary{min-width:100px}#login{max-width:520px;margin:35px auto;padding:22px}.loginPage{min-height:calc(100vh - 90px);display:flex;align-items:center;justify-content:center;padding:28px 14px}.loginWrap{width:100%;max-width:430px;text-align:center}.companyLogo{width:105px;height:105px;object-fit:contain;margin:0 auto 14px;display:block}.loginCard{margin:0;background:#fff;border:1px solid var(--line);border-radius:24px;padding:25px;box-shadow:0 14px 40px #063b2b16;text-align:left}.loginBrand{text-align:center;font-weight:900;color:var(--g);font-size:16px;margin-bottom:18px}.loginBrand small{display:block;color:var(--o);font-style:italic;font-size:11px;margin-top:3px}.loginCard h2{text-align:center;margin:0 0 5px;font-size:25px}.loginCard>p{text-align:center}.loginTabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:#eef3ef;border-radius:13px;padding:4px;margin:18px 0}.tabBtn{border:0;background:transparent;border-radius:10px;padding:10px 5px;font-weight:800;color:var(--muted);cursor:pointer;font-size:12px}.tabBtn.active{background:#fff;color:var(--g);box-shadow:0 2px 7px #063b2b12}@media(max-width:650px){.grid{grid-template-columns:1fr}.head{align-items:flex-start}.jobhead{align-items:flex-start}.stat{font-size:25px}.wrap{padding:0 10px}.card{border-radius:16px;padding:14px}}
</style></head><body><header><div class="head"><div class="brand">GARHWAL TOUR N ADVENTURE<small>Staff App</small></div><button id="logout" class="btn ghost hidden">Logout</button></div></header><main class="wrap">
<section id="loginPage" class="loginPage"><div class="loginWrap"><img class="companyLogo" src="/logo.svg" alt="Garhwal Tour N Adventure"><section id="login" class="card loginCard"><div class="loginBrand">GARHWAL TOUR N ADVENTURE<small>Staff Portal</small></div><h2>Welcome back 👋</h2><p class="muted">Sign in with your email or phone number.</p><div class="loginTabs"><button id="loginTab" class="tabBtn active" type="button">Login</button><button id="registerTab" class="tabBtn" type="button">Register</button><button id="forgotTab" class="tabBtn" type="button">Forgot Password</button></div><div id="loginForm"><label>Email or phone</label><input id="username" inputmode="email" autocomplete="username" placeholder="Email or phone number"><label style="display:block;margin-top:10px">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"><div class="actions" style="margin-top:14px"><button id="loginBtn" class="btn primary" type="button">Login</button></div></div><div id="registerForm" class="hidden"><div class="grid"><div><label>Full name</label><input id="regName" placeholder="Your name"></div><div><label>Phone</label><input id="regPhone" inputmode="tel" placeholder="Phone number"></div></div><label style="display:block;margin-top:10px">Email</label><input id="regEmail" type="email" placeholder="Email address"><label style="display:block;margin-top:10px">Password</label><input id="regPassword" type="password" placeholder="Create password"><label style="display:block;margin-top:10px">Designation</label><select id="regDesignation"><option>Driver</option><option>Tour Manager</option><option>Tour Guide</option><option>Booking Executive</option><option>Operations Staff</option><option>Accountant</option></select><button id="registerBtn" class="btn primary" style="width:100%;margin-top:14px" type="button">Send Registration Request</button><p class="muted">Your account will stay pending until Admin approves it.</p></div><div id="forgotForm" class="hidden"><p class="muted">Enter your registered email or phone. Admin will review the reset request.</p><label>Email or phone</label><input id="forgotIdentifier" placeholder="Email or phone number"><button id="forgotBtn" class="btn primary" style="width:100%;margin-top:14px" type="button">Send Reset Request</button></div><p id="msg" class="muted"></p></section></div></section>
<section id="app" class="hidden"><div id="dashboard"></div><div id="jobs"></div></section>
</main><script>
const $=id=>document.getElementById(id);let token='',user=null,bookings=[];let firstLoad=true;
function notifyNewBookings(list){
 if(!user||user.role!=='admin'||!list.length)return;
 const key='gta_last_booking_created_at';
 const latest=list[0]?.created_at||'';
 const previous=localStorage.getItem(key);
 if(!previous){if(latest)localStorage.setItem(key,latest);return;}
 const fresh=list.filter(x=>x.created_at&&x.created_at>previous);
 if(fresh.length){
   const b=fresh[0];
   const title='New Booking — '+b.booking_ref;
   const body=(b.name||'Guest')+' · '+(b.service||'Service')+' · '+(b.date||'Date')+' · '+(b.pax||1)+' pax';
   try{
     if(window.AndroidNotifications?.notifyBooking) window.AndroidNotifications.notifyBooking(title,body);
   }catch(e){}
   if('Notification' in window && Notification.permission==='granted'){
     try{new Notification(title,{body,tag:b.booking_ref})}catch(e){}
   }
   if('Notification' in window && Notification.permission==='default'){
     try{Notification.requestPermission()}catch(e){}
   }
 }
 if(latest)localStorage.setItem(key,latest);
}
async function pollNewBookings(){
 if(!token||!user||user.role!=='admin')return;
 try{
   const x=await api('bookings');
   const list=x.bookings||[];
   notifyNewBookings(list);
   bookings=list;
   // Preserve unsaved worker-creation fields while the 15s booking poll runs.
   const draft={};
   ['wu','wn','wp','wd','pa','pv','pg','pp'].forEach(id=>{
     const el=$(id);
     if(el) draft[id]=el.type==='checkbox'?el.checked:el.value;
   });
   render();
   Object.keys(draft).forEach(id=>{
     const el=$(id);
     if(!el)return;
     if(el.type==='checkbox')el.checked=draft[id]; else el.value=draft[id];
   });
 }catch(e){}
}

const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
async function api(action,opt={}){opt.headers={...(opt.headers||{}),'x-staff-token':token,'Content-Type':'application/json'};const r=await fetch('/api/staff?action='+action,opt);if(!r.ok)throw Error(await r.text());return r.json()}
function showLoginTab(tab){$('loginForm').classList.toggle('hidden',tab!=='login');$('registerForm').classList.toggle('hidden',tab!=='register');$('forgotForm').classList.toggle('hidden',tab!=='forgot');$('loginTab').classList.toggle('active',tab==='login');$('registerTab').classList.toggle('active',tab==='register');$('forgotTab').classList.toggle('active',tab==='forgot');$('msg').textContent='';}
$('loginBtn').onclick=async()=>{const btn=$('loginBtn');btn.disabled=true;try{const identifier=$('username').value.trim(),pw=$('password').value;if(!identifier||!pw)throw Error('Enter your email/phone and password.');let r;if(identifier.toLowerCase()==='admin'){r=await fetch('/api/staff?action=admin-login',{method:'POST',headers:{'x-admin-password':pw}})}else{r=await fetch('/api/staff?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier,password:pw})})}const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Login failed.');token=x.token;user=x.user;sessionStorage.setItem('gta_staff_token',token);sessionStorage.setItem('gta_staff_user',JSON.stringify(user));showApp();}catch(e){$('msg').textContent=e.message||'Login failed.'}finally{btn.disabled=false}};
$('loginTab').onclick=()=>showLoginTab('login');$('registerTab').onclick=()=>showLoginTab('register');$('forgotTab').onclick=()=>showLoginTab('forgot');
$('forgotBtn').onclick=async()=>{const btn=$('forgotBtn');btn.disabled=true;try{const identifier=$('forgotIdentifier').value.trim();if(!identifier)throw Error('Enter your registered email or phone.');const r=await fetch('/api/staff?action=forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier})});const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Could not send reset request.');$('msg').textContent='Reset request sent. Please wait for Admin approval.';}catch(e){$('msg').textContent=e.message||'Could not send reset request.'}finally{btn.disabled=false}};
$('registerBtn').onclick=async()=>{const btn=$('registerBtn');btn.disabled=true;try{const name=$('regName').value.trim(),phone=$('regPhone').value.trim(),email=$('regEmail').value.trim(),password=$('regPassword').value,designation=$('regDesignation').value;if(!name||(!phone&&!email)||password.length<4)throw Error('Enter name, email or phone, and a 4+ character password.');const r=await fetch('/api/staff?action=register-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone,email,password,designation})});const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Registration failed.');$('msg').textContent='Registration request sent. Admin approval is required before login.';$('regPassword').value='';}catch(e){$('msg').textContent=e.message||'Registration failed.'}finally{btn.disabled=false}};
</script></body></html>
