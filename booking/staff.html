<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b2b"><link rel="manifest" href="/staff-manifest.json"><title>Garhwal Staff App</title>
<style>
:root{--g:#063b2b;--o:#f36b08;--gold:#f8c75a;--bg:#eef3ef;--line:#d9e3dc;--muted:#61756d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:#16352c}header{background:var(--g);color:#fff;padding:16px 18px;position:sticky;top:0;z-index:5}.head{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.brand small{display:block;color:var(--gold);font-style:italic}.wrap{max-width:900px;margin:18px auto;padding:0 14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 5px 18px #063b2b0c}input,select{width:100%;padding:11px;border:1px solid #cbd6cf;border-radius:10px;background:#fbfcfa}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:var(--o);color:#fff}.dark{background:var(--g);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--g)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px}.hidden{display:none}.job{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}.jobhead{display:flex;justify-content:space-between;gap:10px}.pill{padding:4px 8px;border-radius:999px;background:#e7f1eb;font-size:11px;font-weight:800}.orange{background:#fff0df;color:#b84c00}.danger{background:#fce5e0;color:#9b2c1c}.stat{font-size:26px;font-weight:900;color:var(--g)}table{width:100%;border-collapse:collapse}td{padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px}a{color:var(--o);font-weight:800;text-decoration:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.head{align-items:flex-start}.jobhead{display:block}.stat{font-size:22px}}
</style></head><body><header><div class="head"><div class="brand">GARHWAL TOUR N ADVENTURE<small>Staff App</small></div><button id="logout" class="btn ghost hidden">Logout</button></div></header><main class="wrap">
<section id="login" class="card"><h2>Staff Login</h2><p class="muted">Admin and workers can sign in here.</p><div class="grid"><div><label>Username</label><input id="username" autocomplete="username"></div><div><label>Password</label><input id="password" type="password" autocomplete="current-password"></div></div><div class="actions" style="margin-top:12px"><button id="loginBtn" class="btn primary">Login</button></div><p id="msg" class="muted"></p></section>
<section id="app" class="hidden"><div id="dashboard"></div><div id="jobs"></div></section>
</main><script>
const $=id=>document.getElementById(id);let token='',user=null,bookings=[];let firstLoad=true;
function notifyNewBookings(list){
 if(!user||user.role!=='admin'||!list.length)return;
 const key='gta_last_booking_created_at';
 const latest=list[0]?.created_at||'';
 const previous=localStorage.getItem(key);
 if(!previous){if(latest)localStorage.setItem(key,latest);return;}
 const fresh=list.filter(x=>x.created_at&&x.created_at>previous);
 if(fresh.length){
   const b=fresh[0];
   const title='New Booking — '+b.booking_ref;
   const body=(b.name||'Guest')+' · '+(b.service||'Service')+' · '+(b.date||'Date')+' · '+(b.pax||1)+' pax';
   try{
     if(window.AndroidNotifications?.notifyBooking) window.AndroidNotifications.notifyBooking(title,body);
   }catch(e){}
   if('Notification' in window && Notification.permission==='granted'){
     try{new Notification(title,{body,tag:b.booking_ref})}catch(e){}
   }
   if('Notification' in window && Notification.permission==='default'){
     try{Notification.requestPermission()}catch(e){}
   }
 }
 if(latest)localStorage.setItem(key,latest);
}
async function pollNewBookings(){
 if(!token||!user||user.role!=='admin')return;
 try{
   const x=await api('bookings');
   const list=x.bookings||[];
   notifyNewBookings(list);
   bookings=list;render();
 }catch(e){}
}

const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
async function api(action,opt={}){opt.headers={...(opt.headers||{}),'x-staff-token':token,'Content-Type':'application/json'};const r=await fetch('/api/staff?action='+action,opt);if(!r.ok)throw Error(await r.text());return r.json()}
$('loginBtn').onclick=async()=>{try{const un=$('username').value.trim().toLowerCase(),pw=$('password').value;let r;if(un==='admin'){r=await fetch('/api/staff?action=admin-login',{method:'POST',headers:{'x-admin-password':pw}})}else{r=await fetch('/api/staff?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:un,password:pw})})}if(!r.ok)throw Error();const x=await r.json();token=x.token;user=x.user;sessionStorage.setItem('gta_staff_token',token);sessionStorage.setItem('gta_staff_user',JSON.stringify(user));showApp();}catch(e){$('msg').textContent='Invalid username or password.'}};
$('logout').onclick=()=>{sessionStorage.clear();location.reload()};
async function registerNativePush(){for(let i=0;i<12;i++){try{const t=window.AndroidNotifications?.getPushToken?.();if(t){const tokenValue=String(t);await api('register-token',{method:'POST',body:JSON.stringify({token:tokenValue})});return}}catch(e){}await new Promise(r=>setTimeout(r,1000));}}
async function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');render();await load();registerNativePush();if(user.role==='admin'){setInterval(pollNewBookings,15000);}}
async function load(){try{bookings=(await api('bookings')).bookings||[];render();if(user.role==='admin')loadUsers()}catch(e){$('msg').textContent='Session expired. Please login again.'}}
async function loadUsers(){try{const r=await api('users');$('usersList').innerHTML=r.users.filter(u=>u.username!=='admin').map(u=>'<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>'+u.display_name+'</b> · '+u.username+' · '+(u.active?'Active':'Disabled')+' <button class="btn ghost" style="padding:5px 8px;margin-left:8px" onclick="toggleUser(\''+u.id+'\','+(u.active?'false':'true')+')">'+(u.active?'Disable':'Enable')+'</button></div>').join('')||'No worker accounts yet.'}catch(e){$('usersList').textContent='Could not load workers.'}}
async function createWorker(){const username=$('wu').value.trim(),display_name=$('wn').value.trim(),password=$('wp').value;if(!username||!display_name||password.length<4)return alert('Enter username, worker name and a 4+ character password.');try{await api('users',{method:'POST',body:JSON.stringify({username,display_name,password})});$('wu').value='';$('wn').value='';$('wp').value='';await loadUsers();alert('Worker account created.')}catch(e){alert('Could not create worker. Username may already exist.')}}
async function toggleUser(id,active){try{await api('users',{method:'PATCH',body:JSON.stringify({id,active})});await loadUsers()}catch(e){alert('Could not update worker.')}}
function render(){if(!user)return;const mine=user.role==='worker';const total=bookings.length,active=bookings.filter(x=>x.status==='Confirmed').length;let h='<div class="card"><div class="jobhead"><div><div class="muted">'+(mine?'Welcome':'Welcome Admin')+'</div><h2 style="margin:3px 0">'+user.display_name+'</h2></div><div class="stat">'+total+'</div></div><div class="muted">'+(mine?'Assigned bookings':'All bookings')+' · '+active+' confirmed</div></div>';if(user.role==='admin')h+='<div class="card"><h3>Admin shortcuts</h3><div class="actions"><a class="btn dark" href="/admin.html">Open Full Admin & Invoice</a></div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><h3>Worker Accounts</h3><div class="grid"><input id="wu" placeholder="Username"><input id="wn" placeholder="Worker name (must match Driver name)"><input id="wp" type="password" placeholder="Temporary password"></div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="createWorker()">Create Worker</button></div><div id="usersList" class="muted" style="margin-top:10px">Loading workers…</div></div>'; $('dashboard').innerHTML=h;
let j=bookings.map(r=>'<div class="job"><div class="jobhead"><div><b>'+r.booking_ref+'</b><div class="muted">'+r.date+' · '+r.service+' · '+r.pax+' pax</div></div><span class="pill '+(r.status==='Cancelled'?'danger':r.status==='New'?'orange':'')+'">'+r.status+'</span></div><table style="margin-top:9px"><tr><td><b>Guest</b></td><td>'+r.name+'</td></tr><tr><td><b>Phone</b></td><td><a href="tel:'+r.phone+'">'+r.phone+'</a></td></tr><tr><td><b>Details</b></td><td>'+((r.details||'—'))+'</td></tr><tr><td><b>Vehicle</b></td><td>'+((r.vehicle||'—'))+'</td></tr><tr><td><b>Driver</b></td><td>'+((r.driver||'—'))+'</td></tr>'+(mine?'':'<tr><td><b>Payment</b></td><td>'+money(r.paid)+' / '+money(r.price)+'</td></tr>')+'</table><div class="actions" style="margin-top:10px"><a class="btn primary" href="tel:'+r.phone+'">Call Guest</a><a class="btn ghost" href="https://wa.me/'+String(r.phone).replace(/\D/g,'')+'" target="_blank">WhatsApp</a></div></div>').join('');$('jobs').innerHTML='<div class="card"><h3>'+(mine?'My Assigned Jobs':'Recent Bookings')+'</h3>'+ (j||'<p class="muted">No bookings yet.</p>')+'</div>';}
(function(){const t=sessionStorage.getItem('gta_staff_token'),u=sessionStorage.getItem('gta_staff_user');if(t&&u){token=t;try{user=JSON.parse(u);showApp()}catch{sessionStorage.clear()}}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/staff-sw.js');
</script></body></html>
