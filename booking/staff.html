<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b2b"><link rel="manifest" href="/staff-manifest.json"><title>Garhwal Staff App</title>
<style>
:root{--g:#063b2b;--g2:#0b513d;--o:#f36b08;--gold:#f8c75a;--bg:#f4f7f5;--line:#e1e8e4;--muted:#6b7c75;--text:#17372d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text)}header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:15px 16px;position:sticky;top:0;z-index:5;box-shadow:0 3px 14px #063b2b22}.head{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:14px;letter-spacing:.2px}.brand small{display:block;color:var(--gold);font-style:italic;font-size:11px;margin-top:2px}.wrap{max-width:900px;margin:14px auto;padding:0 12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 5px 20px #063b2b0b}input,select{width:100%;padding:12px;border:1px solid #d2ddd7;border-radius:12px;background:#fbfcfa;font-size:14px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:var(--o);color:#fff}.dark{background:var(--g);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--g)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px}.hidden{display:none}.job{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:10px;box-shadow:0 3px 12px #063b2b08}.jobhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.jobhead b{font-size:15px}.pill{padding:5px 9px;border-radius:999px;background:#e7f1eb;font-size:11px;font-weight:800;white-space:nowrap}.orange{background:#fff0df;color:#b84c00}.danger{background:#fce5e0;color:#9b2c1c}.stat{font-size:30px;font-weight:900;color:var(--g)}table{width:100%;border-collapse:separate;border-spacing:0 3px}td{padding:7px 5px;font-size:13px;vertical-align:top}td:first-child{width:34%;color:var(--muted)}a{color:var(--o);font-weight:800;text-decoration:none}.heroCard{display:flex;justify-content:space-between;align-items:center}.quickStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:-3px 0 14px}.quickStats>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center}.quickStats b{display:block;font-size:20px;color:var(--g)}.quickStats span{font-size:11px;color:var(--muted)}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:8px 2px}.sectionTitle h3{margin:0 0 8px}.jobGuest{display:flex;align-items:center;gap:10px;margin:12px 0;padding:10px;border-radius:12px;background:#f7faf8}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--g);color:#fff;font-weight:900}.jobGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.jobGrid>div{padding:9px;border:1px solid var(--line);border-radius:11px}.jobGrid span{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.jobGrid b{font-size:13px}details{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}summary{cursor:pointer;font-weight:800;color:var(--g);font-size:13px}.job .actions{margin-top:12px}.job .actions .btn{flex:1;text-align:center}.job .actions .primary{min-width:100px}#login{max-width:520px;margin:40px auto;padding:22px}#login h2{margin:0 0 6px;font-size:24px}#app{padding-bottom:20px}@media(max-width:650px){.grid{grid-template-columns:1fr}.head{align-items:flex-start}.jobhead{align-items:flex-start}.stat{font-size:25px}.wrap{padding:0 10px}.card{border-radius:16px;padding:14px}}
</style></head><body><header><div class="head"><div class="brand">GARHWAL TOUR N ADVENTURE<small>Staff App</small></div><button id="logout" class="btn ghost hidden">Logout</button></div></header><main class="wrap">
<section id="login" class="card"><h2>Staff Login</h2><p class="muted">Admin and workers can sign in here.</p><div class="grid"><div><label>Username</label><input id="username" autocomplete="username"></div><div><label>Password</label><input id="password" type="password" autocomplete="current-password"></div></div><div class="actions" style="margin-top:12px"><button id="loginBtn" class="btn primary">Login</button></div><p id="msg" class="muted"></p></section>
<section id="app" class="hidden"><div id="dashboard"></div><div id="jobs"></div></section>
</main><script>
const $=id=>document.getElementById(id);let token='',user=null,bookings=[];let firstLoad=true;
function notifyNewBookings(list){
 if(!user||user.role!=='admin'||!list.length)return;
 const key='gta_last_booking_created_at';
 const latest=list[0]?.created_at||'';
 const previous=localStorage.getItem(key);
 if(!previous){if(latest)localStorage.setItem(key,latest);return;}
 const fresh=list.filter(x=>x.created_at&&x.created_at>previous);
 if(fresh.length){
   const b=fresh[0];
   const title='New Booking — '+b.booking_ref;
   const body=(b.name||'Guest')+' · '+(b.service||'Service')+' · '+(b.date||'Date')+' · '+(b.pax||1)+' pax';
   try{
     if(window.AndroidNotifications?.notifyBooking) window.AndroidNotifications.notifyBooking(title,body);
   }catch(e){}
   if('Notification' in window && Notification.permission==='granted'){
     try{new Notification(title,{body,tag:b.booking_ref})}catch(e){}
   }
   if('Notification' in window && Notification.permission==='default'){
     try{Notification.requestPermission()}catch(e){}
   }
 }
 if(latest)localStorage.setItem(key,latest);
}
async function pollNewBookings(){
 if(!token||!user||user.role!=='admin')return;
 try{
   const x=await api('bookings');
   const list=x.bookings||[];
   notifyNewBookings(list);
   bookings=list;
   // Preserve unsaved worker-creation fields while the 15s booking poll runs.
   const draft={};
   ['wu','wn','wp','wd','pa','pv','pg','pp'].forEach(id=>{
     const el=$(id);
     if(el) draft[id]=el.type==='checkbox'?el.checked:el.value;
   });
   render();
   Object.keys(draft).forEach(id=>{
     const el=$(id);
     if(!el)return;
     if(el.type==='checkbox')el.checked=draft[id]; else el.value=draft[id];
   });
 }catch(e){}
}

const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
async function api(action,opt={}){opt.headers={...(opt.headers||{}),'x-staff-token':token,'Content-Type':'application/json'};const r=await fetch('/api/staff?action='+action,opt);if(!r.ok)throw Error(await r.text());return r.json()}
$('loginBtn').onclick=async()=>{try{const un=$('username').value.trim().toLowerCase(),pw=$('password').value;let r;if(un==='admin'){r=await fetch('/api/staff?action=admin-login',{method:'POST',headers:{'x-admin-password':pw}})}else{r=await fetch('/api/staff?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:un,password:pw})})}if(!r.ok)throw Error();const x=await r.json();token=x.token;user=x.user;sessionStorage.setItem('gta_staff_token',token);sessionStorage.setItem('gta_staff_user',JSON.stringify(user));showApp();}catch(e){$('msg').textContent='Invalid username or password.'}};
$('logout').onclick=()=>{sessionStorage.clear();location.reload()};
async function registerNativePush(){
 for(let i=0;i<60;i++){
  try{
   const t=window.AndroidNotifications?.getPushToken?.();
   if(t){
    await api('register-token',{method:'POST',body:JSON.stringify({token:String(t)})});
    return true;
   }
  }catch(e){}
  await new Promise(r=>setTimeout(r,1000));
 }
 return false;
}
async function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');render();await load();registerNativePush();if(user.role==='admin'){setInterval(()=>{registerNativePush();pollNewBookings()},15000);}}
async function load(){try{bookings=(await api('bookings')).bookings||[];render();if(user.role==='admin')loadUsers()}catch(e){$('msg').textContent='Session expired. Please login again.'}}
async function loadUsers(){try{const r=await api('users');$('usersList').innerHTML=r.users.filter(u=>u.username!=='admin').map(u=>{let p={};try{p=JSON.parse(u.permissions||'{}')}catch(e){}const n=String(u.display_name||'').replace(/'/g,'');const d=String(u.designation||'Staff').replace(/'/g,'');return '<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>'+n+'</b> · '+d+' · '+u.username+' · '+(u.active?'Active':'Disabled')+'<div class="muted" style="margin:3px 0 7px">'+(p.view_all?'All bookings':'Assigned bookings')+' · '+(p.guest_contact?'Guest contact':'No guest contact')+' · '+(p.payment_details?'Payment details':'No payment details')+'</div><div class="actions"><button class="btn ghost" style="padding:5px 8px" onclick="editUser(\''+u.id+'\',\''+n+'\',\''+d+'\','+(!!p.view_assigned)+','+(!!p.view_all)+','+(!!p.guest_contact)+','+(!!p.payment_details)+')">Edit Permissions</button><button class="btn ghost" style="padding:5px 8px" onclick="toggleUser(\''+u.id+'\','+(u.active?'false':'true')+')">'+(u.active?'Disable':'Enable')+'</button><button class="btn danger" style="padding:5px 8px" onclick="deleteUser(\''+u.id+'\',\''+n+'\')">Delete</button></div></div>'}).join('')||'No worker accounts yet.'}catch(e){$('usersList').textContent='Could not load workers.'}}
async function editUser(id,name,designation,assigned,all,contact,payment){const d=prompt('Designation:',designation);if(d===null)return;const a=confirm('Allow assigned bookings?\nOK = Yes, Cancel = No');const v=confirm('Allow ALL bookings?\nOK = Yes, Cancel = No');const g=confirm('Allow guest contact / phone / WhatsApp?\nOK = Yes, Cancel = No');const p=confirm('Allow payment details?\nOK = Yes, Cancel = No');if(!a&&!v)return alert('Worker must have at least one booking access permission.');try{await api('users',{method:'PATCH',body:JSON.stringify({id,designation:d.trim()||'Staff',permissions:{view_assigned:a,view_all:v,guest_contact:g,payment_details:p}})});await loadUsers();alert('Worker permissions updated.')}catch(e){alert(e.message||'Could not update worker.')}}
async function deleteUser(id,name){if(!confirm('Delete worker '+name+'? This cannot be undone.'))return;try{await api('users',{method:'DELETE',body:JSON.stringify({id})});await loadUsers();alert('Worker deleted.')}catch(e){alert(e.message||'Could not delete worker.')}}
async function createWorker(){const username=$('wu').value.trim(),display_name=$('wn').value.trim(),password=$('wp').value,designation=$('wd').value;const permissions={view_assigned:$('pa').checked,view_all:$('pv').checked,guest_contact:$('pg').checked,payment_details:$('pp').checked};if(!username||!display_name||password.length<4)return alert('Enter username, worker name and a 4+ character password.');if(!permissions.view_assigned&&!permissions.view_all)return alert('Give the worker at least one booking access permission.');try{await api('users',{method:'POST',body:JSON.stringify({username,display_name,password,designation,permissions})});$('wu').value='';$('wn').value='';$('wp').value='';await loadUsers();alert('Worker account created.')}catch(e){alert(e.message||'Could not create worker.')}}
async function toggleUser(id,active){try{await api('users',{method:'PATCH',body:JSON.stringify({id,active})});await loadUsers()}catch(e){alert('Could not update worker.')}}
function render(){if(!user)return;const mine=user.role==='worker';const total=bookings.length,active=bookings.filter(x=>x.status==='Confirmed').length,newJobs=bookings.filter(x=>x.status==='New').length;let h='<div class="card heroCard"><div><div class="muted">'+(mine?'Welcome back':'Welcome')+'</div><h2 style="margin:4px 0 3px">'+user.display_name+'</h2>'+(mine?'<span class="pill">'+(user.designation||'Staff')+'</span>':'<span class="pill">Administrator</span>')+'</div><div class="stat">'+total+'</div></div><div class="quickStats"><div><b>'+total+'</b><span>Total jobs</span></div><div><b>'+active+'</b><span>Confirmed</span></div><div><b>'+newJobs+'</b><span>New</span></div></div>';
if(user.role==='admin')h+='<div class="card"><h3 style="margin-top:0">Admin</h3><div class="actions"><a class="btn dark" href="/admin.html">Open Admin & Invoice</a></div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><h3>Worker Accounts</h3><div class="grid"><input id="wu" placeholder="Username"><input id="wn" placeholder="Worker name (must match Driver name)"><input id="wp" type="password" placeholder="Temporary password"><select id="wd"><option>Driver</option><option>Tour Manager</option><option>Tour Guide</option><option>Booking Executive</option><option>Operations Staff</option><option>Accountant</option></select></div><div style="margin-top:12px"><b>Permissions</b><div class="grid" style="margin-top:8px"><label><input id="pa" type="checkbox" checked style="width:auto"> Assigned bookings</label><label><input id="pv" type="checkbox" style="width:auto"> All bookings</label><label><input id="pg" type="checkbox" checked style="width:auto"> Guest contact</label><label><input id="pp" type="checkbox" style="width:auto"> Payment details</label></div><p class="muted" style="margin:8px 0 0">Delete bookings, create workers and full admin/invoice control remain Admin-only.</p></div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="createWorker()">Create Worker</button></div><div id="usersList" class="muted" style="margin-top:10px">Loading workers…</div></div>';
$('dashboard').innerHTML=h;
let j=bookings.map(r=>{const canContact=!mine||user.permissions?.guest_contact;const canPay=!mine||user.permissions?.payment_details;return '<div class="job"><div class="jobhead"><div><b>'+r.booking_ref+'</b><div class="muted">'+(r.date||'Date not set')+' · '+r.service+' · '+r.pax+' pax</div></div><span class="pill '+(r.status==='Cancelled'?'danger':r.status==='New'?'orange':'')+'">'+r.status+'</span></div><div class="jobGuest"><div class="avatar">'+String(r.name||'G').trim().charAt(0).toUpperCase()+'</div><div><b>'+r.name+'</b><div class="muted">'+(canContact?r.phone:'Contact hidden by permission')+'</div></div></div><div class="jobGrid"><div><span>Service</span><b>'+r.service+'</b></div><div><span>Pax</span><b>'+r.pax+'</b></div><div><span>Vehicle</span><b>'+(r.vehicle||'Not assigned')+'</b></div><div><span>Driver</span><b>'+(r.driver||'Not assigned')+'</b></div></div><details><summary>View booking details</summary><table><tr><td><b>Tour / Service</b></td><td>'+(r.details||'—')+'</td></tr><tr><td><b>Additional Note</b></td><td>'+(r.payment_note||'—')+'</td></tr>'+(canPay?'<tr><td><b>Payment</b></td><td>'+money(r.paid)+' / '+money(r.price)+'</td></tr>':'')+'</table></details>'+(canContact?'<div class="actions" style="margin-top:12px"><a class="btn primary" href="tel:'+r.phone+'">📞 Call Guest</a><a class="btn ghost" href="https://wa.me/'+String(r.phone).replace(/\D/g,'')+'" target="_blank">💬 WhatsApp</a></div>':'<div class="muted" style="margin-top:12px">Guest contact is hidden by your permission.</div>')+'</div>'}).join('');
$('jobs').innerHTML='<div class="sectionTitle"><h3>'+ (mine?'My Jobs':'Recent Bookings')+'</h3><span class="muted">'+total+' total</span></div>'+ (j||'<div class="card"><p class="muted">No bookings yet.</p></div>');}
(function(){const t=sessionStorage.getItem('gta_staff_token'),u=sessionStorage.getItem('gta_staff_user');if(t&&u){token=t;try{user=JSON.parse(u);showApp()}catch{sessionStorage.clear()}}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/staff-sw.js');
</script></body></html>
