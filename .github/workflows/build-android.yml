name: Build Staff Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-staff-app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: android-staff-app
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Staff APK
        uses: actions/upload-artifact@v4
        with:
          name: garhwal-staff-debug-apk
          path: android-staff-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
